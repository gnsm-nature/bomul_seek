<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>과학보물찾기 완료</title>
<style>
  * { box-sizing:border-box; }
  body {
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    font-family:Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    color:#17324f;
    background:
      radial-gradient(circle at 20% 10%, rgba(87,173,255,.22), transparent 30%),
      linear-gradient(160deg,#eef8ff 0%,#f8fbff 52%,#eaf4fb 100%);
  }
  .card {
    width:min(560px,100%);
    padding:46px 26px;
    text-align:center;
    background:#fff;
    border:1px solid #d8e5f2;
    border-radius:30px;
    box-shadow:0 18px 50px rgba(22,70,120,.13);
  }
  .check {
    width:86px;
    height:86px;
    margin:0 auto 22px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:#e8f8ef;
    color:#14905d;
    font-size:46px;
    font-weight:900;
  }
  h1 {
    margin:0 0 12px;
    font-size:clamp(34px,8vw,52px);
    letter-spacing:-.05em;
  }
  p {
    margin:0;
    color:#60748a;
    font-size:15px;
    line-height:1.7;
  }
  .brand {
    margin-top:28px;
    color:#2e659b;
    font-size:13px;
    font-weight:800;
  }
</style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1>완료했습니다.</h1>
    <p>과학보물찾기 미션 제출이 완료되었습니다.</p>
    <div class="brand">국립과천과학관 · 과학보물찾기</div>
  </main>
</body>
</html>
